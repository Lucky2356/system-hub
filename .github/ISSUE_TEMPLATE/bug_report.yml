name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not report security issues here — see
        [SECURITY.md](../../blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
      placeholder: On the Services tab I clicked Restart on nginx and…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `system-hub --version`.
      placeholder: system-hub v0.2.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant lines from the log file, if any. Location:
        Linux `~/.config/system-hub/`, Windows `%APPDATA%\system-hub\`.
      render: text
