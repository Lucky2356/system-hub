name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the app makes hard today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like it to do instead?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform this matters for
      multiple: true
      options:
        - Linux
        - Windows
        - Both
