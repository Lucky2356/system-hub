name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Linux: build a CGO binary, then produce .deb and .rpm via nfpm.
  #
  # Both architectures build natively rather than cross-compiling: Fyne needs
  # CGO, so an arm64 cross-build would mean shipping a C toolchain and the X11
  # headers for the foreign arch. The arm64 runner is free for public repos.
  # ---------------------------------------------------------------------------
  linux:
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.version }}"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Install Fyne build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc pkg-config \
            libgl1-mesa-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxxf86vm-dev libxkbcommon-dev

      - name: Build binary
        env:
          CGO_ENABLED: '1'
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/Lucky2356/system-hub/internal/version.Version=${{ steps.ver.outputs.tag }}" \
            -o system-hub ./cmd/system-hub

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build packages
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          nfpm pkg --packager deb --target dist/
          nfpm pkg --packager rpm --target dist/

      # A package built for the wrong architecture installs and then fails to
      # run, so check what was actually produced rather than trusting the label
      # in the file name.
      - name: Verify package architecture
        run: |
          file system-hub
          deb=$(ls dist/*.deb)
          got=$(dpkg-deb --field "$deb" Architecture)
          if [ "$got" != "${{ matrix.arch }}" ]; then
            echo "::error::$deb reports Architecture=$got, expected ${{ matrix.arch }}"
            exit 1
          fi
          echo "$deb: Architecture=$got"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            system-hub
            dist/*.deb
            dist/*.rpm

  # ---------------------------------------------------------------------------
  # Windows: build a CGO binary and package it as a Windows .exe via fyne.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.version }}"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Embed icon and version metadata
        shell: bash
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          "$(go env GOPATH)/bin/goversioninfo" \
            -o cmd/system-hub/resource.syso \
            -product-version "${{ steps.ver.outputs.version }}" \
            -file-version "${{ steps.ver.outputs.version }}" \
            packaging/windows/versioninfo.json

      - name: Build system-hub.exe
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p build
          go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X github.com/Lucky2356/system-hub/internal/version.Version=${{ steps.ver.outputs.tag }}" \
            -o build/system-hub.exe ./cmd/system-hub

      # Code signing runs only when a certificate secret is configured, so the
      # workflow is signing-ready today and starts signing the day a certificate
      # is bought — no workflow edit needed. Unsigned, Windows SmartScreen warns
      # on the downloaded installer (see the README).
      - name: Sign the binary
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          & signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            build\system-hub.exe
          if ($LASTEXITCODE -ne 0) { throw "signing the binary failed" }

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) { throw "version output is empty" }
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "Using $iscc"
          & $iscc /DMyAppVersion=$ver packaging\windows\system-hub.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Sign the installer
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          Get-ChildItem dist\system-hub-*-setup.exe | ForEach-Object {
            & signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing the installer failed" }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            build/system-hub.exe
            dist/system-hub-*-setup.exe

  # ---------------------------------------------------------------------------
  # Attach everything to the GitHub Release (tag pushes only).
  # ---------------------------------------------------------------------------
  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-packages-*/dist/*.deb
            artifacts/linux-packages-*/dist/*.rpm
            artifacts/windows-exe/dist/system-hub-*-setup.exe
            artifacts/windows-exe/build/system-hub.exe
